name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Source/ShowTranslationKeys.csproj

      - name: Build
        run: dotnet build -c Release Source/ShowTranslationKeys.csproj --no-restore

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Stage mod folder
        shell: bash
        run: |
          set -e
          STAGE="staging/ShowTranslationKeys"
          mkdir -p "$STAGE/Assemblies"
          cp -r About "$STAGE/"
          cp -r Languages "$STAGE/"
          cp LICENSE "$STAGE/"
          cp README.md "$STAGE/"
          cp Source/bin/Release/net472/ShowTranslationKeys.dll "$STAGE/Assemblies/"

          # Inject the resolved version into About.xml
          sed -i "s|<modVersion>.*</modVersion>|<modVersion>${{ steps.version.outputs.version }}</modVersion>|" \
            "$STAGE/About/About.xml"

          echo "Staged contents:"
          find "$STAGE" -type f | sort

      - name: Package zip
        shell: bash
        run: |
          set -e
          NAME="ShowTranslationKeys-${{ steps.version.outputs.version }}"
          cd staging
          zip -r "../${NAME}.zip" ShowTranslationKeys
          cd ..
          ls -lh "${NAME}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowTranslationKeys-${{ steps.version.outputs.version }}
          path: |
            ShowTranslationKeys-${{ steps.version.outputs.version }}.zip
            Source/bin/Release/net472/ShowTranslationKeys.dll
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ShowTranslationKeys ${{ steps.version.outputs.version }}
          files: |
            ShowTranslationKeys-${{ steps.version.outputs.version }}.zip
            Source/bin/Release/net472/ShowTranslationKeys.dll
          generate_release_notes: true
          draft: false
          prerelease: false
