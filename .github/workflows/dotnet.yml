name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Source/ShowTranslationKeys.csproj --configuration Release

      - name: Locate DLL
        id: dll
        shell: bash
        run: |
          set -euo pipefail
          DLL="Source/bin/Release/ShowTranslationKeys.dll"
          if [ ! -f "$DLL" ]; then
            echo "ERROR: expected build output not found: $DLL"
            find Source/bin -type f || true
            exit 1
          fi
          echo "path=$DLL" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage mod folder
        shell: bash
        run: |
          set -euo pipefail
          STAGE="staging/ShowTranslationKeys"
          mkdir -p "$STAGE/Assemblies"
          cp -r About Languages "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          cp "${{ steps.dll.outputs.path }}" "$STAGE/Assemblies/ShowTranslationKeys.dll"
          sed -i "s|<modVersion>.*</modVersion>|<modVersion>${{ steps.version.outputs.version }}</modVersion>|" \
            "$STAGE/About/About.xml"
          find "$STAGE" -type f | sort

      - name: Package zip
        shell: bash
        run: |
          set -euo pipefail
          NAME="ShowTranslationKeys-${{ steps.version.outputs.version }}"
          cd staging
          zip -r "../${NAME}.zip" ShowTranslationKeys

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowTranslationKeys-${{ steps.version.outputs.version }}
          path: |
            ShowTranslationKeys-${{ steps.version.outputs.version }}.zip
            ${{ steps.dll.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ShowTranslationKeys ${{ steps.version.outputs.version }}
          files: |
            ShowTranslationKeys-${{ steps.version.outputs.version }}.zip
            ${{ steps.dll.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
